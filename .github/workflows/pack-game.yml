name: Pack game (NX2Apple test)

on:
  workflow_dispatch:

jobs:
  pack:
    runs-on: xcode-27
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ secrets.RELAY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          set -x
          df -h /
          # Attempt 3 (43765937663) died of disk-full in the Build step: the
          # runner could not even write its own diag log, and no logs or
          # artifacts survived. Peak usage is ~35 GB (9 GB base.nsp + 8.4 GB
          # extracted + ~8.6 GB romfs.img + engine/build), so reclaim space
          # up front and never keep two copies of the 9 GB base.
          # Simulator runtimes + caches are the biggest safe reclaim.
          sudo rm -rf /Library/Developer/CoreSimulator/* ~/Library/Developer/CoreSimulator/* 2>/dev/null || true
          rm -rf ~/Library/Caches/* /Users/runner/.cache/* 2>/dev/null || true
          # Drop every Xcode except the one this build selects (27.1, per
          # build.log); each Xcode install is ~15 GB.
          ls -d /Applications/Xcode*.app 2>/dev/null | grep -v 'Xcode_27.1.app' | xargs -r sudo rm -rf || true
          brew cleanup --prune=all -s 2>/dev/null || true
          df -h /

      - name: Download inputs from relay repo
        run: |
          set -eux
          mkdir -p inputs game keys
          gh release download ff-resonance --repo 642223522/game-relay --dir inputs
          ls -la inputs
          cat inputs/base.nsp.part-* > game/base.nsp
          # Drop the 9 GB parts the moment the single copy exists.
          rm -f inputs/base.nsp.part-*
          mv inputs/update.nsp inputs/dlc1.nsp inputs/dlc2.nsp inputs/dlc3.nsp game/
          cp inputs/prod.keys keys/prod.keys
          rm -rf inputs
          ls -la game keys
          df -h /

      - name: Sync engine
        run: python3 tools/engine.py sync

      - name: Brew tools
        run: brew bundle --file=Brewfile

      - name: Python venv
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install lz4 capstone fonttools zbic nsz
          # backports.zstd only exists for Python < 3.14 (engine uses stdlib
          # compression.zstd on 3.14+); the runner's python3 is 3.15, where no
          # backports.zstd release installs. Install it only when needed.
          .venv/bin/python -c "import sys; sys.exit(0 if sys.version_info < (3, 14) else 1)" && .venv/bin/python -m pip install backports.zstd || true

      - name: Build IPA (separate romfs, game icon)
        run: |
          set -euxo pipefail
          mkdir -p out
          # Disk watcher: if the runner dies of disk-full again, the
          # 5-minute df snapshots in df-watch.log survive via the deliver
          # artifact (the build log alone did not survive attempt 3).
          (while true; do date -u '+%Y-%m-%dT%H:%M:%SZ'; df -h /; sleep 300; done > df-watch.log 2>&1 &)
          # iPhone Duo (foldable, 1.43:1 inner screen): never stretch, never crop.
          # fit = true 16:9 picture with bars; screen aspect auto = use the
          # engine's taller-shape extension if the game profile gains it.
          printf 'DM_PICTURE_FIT=fit\nDM_SCREEN_ASPECT=auto\n' > env.txt
          # Runner has Xcode 27.1 Metal (32023.921); the shader chain was tested
          # with Xcode 27.2 (32023.922). --allow-other-metal is the engine's own
          # escape hatch for this (other games ship builds made this way).
          .venv/bin/python engine/scripts/build_ipa_from_nsp.py game -k keys/prod.keys \
            --title-id 0100B8A026F14000 --romfs separate -l zh-Hant --env-file env.txt \
            --allow-other-metal \
            -o out/ff-resonance.ipa \
            2>&1 | tee build.log
          find . -name '*.ipa' -o -name 'romfs.img' | head -20
          ls -la out
          df -h /

      - name: Collect outputs
        if: always()
        run: |
          mkdir -p deliver
          find . -name '*.ipa' -exec cp {} deliver/ \; 2>/dev/null || true
          find . -name 'romfs.img' -exec cp {} deliver/ \; 2>/dev/null || true
          cp build.log deliver/ 2>/dev/null || true
          cp df-watch.log deliver/ 2>/dev/null || true
          ls -la deliver

      - name: Upload deliverables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nx2apple-ff-resonance
          path: deliver/
          retention-days: 3
          if-no-files-found: warn
